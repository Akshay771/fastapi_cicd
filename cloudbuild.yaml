# Google Cloud Build CI/CD Pipeline
steps:
  # Step 1: Install Python dependencies
  - name: 'python:3.11-slim'
    entrypoint: 'pip'
    args: ['install', '-r', 'requirements.txt']
    # id: 'install-dependencies'

  # # Step 2: Run tests (if you have tests)
  # - name: 'python:3.11-slim'
  #   entrypoint: 'python'
  #   args: ['-m', 'pytest', 'tests/', '-v']
  #   id: 'run-tests'
  #   waitFor: ['install-dependencies']
  #   # Comment out if no tests yet
  #   env:
  #     - 'PYTHONPATH=/workspace'

  # Step 3: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fastapi-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fastapi-app:latest'
      - '.'
    id: 'build-docker-image'
    waitFor: ['run-tests']

  # Step 4: Push Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fastapi-app:$COMMIT_SHA'
    id: 'push-docker-image'
    waitFor: ['build-docker-image']

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'fastapi-app'
      - '--image=gcr.io/$PROJECT_ID/fastapi-app:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'
    id: 'deploy-to-cloud-run'
    waitFor: ['push-docker-image']

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/fastapi-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/fastapi-app:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'

# Timeout for entire build
timeout: '1200s'
